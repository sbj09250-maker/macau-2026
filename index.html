<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA 澳門資產轉移行動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: mobile app shell. Fixed top tab bar; itinerary = vertical day pills (left) + timeline of dark cards (right). Mavericks blue / Rockets red. */
:root{
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#f5f7fa;
  --ink:#141a24;
  --muted:#667085;
  --line:#e1e6ee;
  --blue:#1d5fd1;
  --red:#d6283a;
  --gold:#c98a12;
  --green:#1f8a55;
  --card:#111827;
  --card-ink:#f3f5f9;
  --taxi:#facc15;
  --nav:rgba(255,255,255,.92);
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f17;--surface:#151b26;--surface-2:#1b2230;--ink:#e9edf4;--muted:#98a2b3;--line:#263042;
  --blue:#6b9cf0;--red:#f0606f;--gold:#e7b14a;--green:#4fc287;--card:#0f1520;--nav:rgba(18,23,33,.92);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f17;--surface:#151b26;--surface-2:#1b2230;--ink:#e9edf4;--muted:#98a2b3;--line:#263042;
  --blue:#6b9cf0;--red:#f0606f;--gold:#e7b14a;--green:#4fc287;--card:#0f1520;--nav:rgba(18,23,33,.92);color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* top nav */
nav.tabs{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:flex;height:56px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--blue)}
nav.tabs button[aria-selected="true"][data-tab="addr"]{color:var(--red)}
nav.tabs button[aria-selected="true"][data-tab="calc"]{color:var(--gold)}
nav.tabs button[aria-selected="true"][data-tab="tools"]{color:var(--green)}
nav.tabs button[aria-selected="true"][data-tab="eat"]{color:var(--red)}
.warn{border-color:var(--red);background:var(--surface)}
.warn b{color:var(--red)}
.item{display:flex;gap:10px;align-items:flex-start}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:700}
.item .wh{font-size:12px;color:var(--blue)}
.item .nt{font-size:12.5px;color:var(--muted)}
.item .chk{border:0;padding:2px 0 0}
.meds{display:flex;flex-direction:column}

main{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:72px 48px}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--card);color:var(--card-ink);min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;margin-bottom:18px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,14,22,.95) 10%,rgba(10,14,22,.35) 70%,transparent)}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:11px;letter-spacing:.14em;opacity:.8;font-weight:700}
.hero h1{margin:2px 0 6px;font-size:26px;font-weight:900;line-height:1.2;text-wrap:balance}
.hero .vs{font-family:var(--num);font-size:17px;font-weight:700;letter-spacing:.04em}
.hero .vs .m{color:#7fb0ff}.hero .vs .r{color:#ff7b88}
.countdown{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 10px}

/* itinerary layout */
.itin{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.pills{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.pill{height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:transform .2s}
.pill .d{font-family:var(--num);font-weight:700;font-size:17px;line-height:1}
.pill .w{font-size:11px;margin-top:3px}
.pill.game .w::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--red);margin:3px auto 0}
.pill[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:transparent;transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.pill[aria-selected="true"].game .w::after{background:#ff7b88}
.dayview{min-width:0}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.dayhead h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;text-wrap:balance}
.dayhead h2::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--blue);flex:none}
.wx{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* timeline */
.tl{position:relative;padding-left:18px}
.act{position:relative;padding-bottom:22px}
.act::before{content:"";position:absolute;left:-12px;top:12px;bottom:-4px;width:1px;background:var(--line)}
.act:last-child::before{display:none}
.dot{position:absolute;left:-24px;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);z-index:2}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--card);color:var(--card-ink);box-shadow:0 10px 24px rgba(10,20,40,.16)}
.card .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.card .glyph{position:absolute;right:-14px;top:-10px;opacity:.13;color:#fff}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,14,22,.96) 25%,rgba(10,14,22,.55) 70%,rgba(10,14,22,.15))}
.card .c{position:relative;padding:18px 16px 16px;display:flex;flex-direction:column;gap:9px}
.card.has-img .c{padding-top:84px}
.t-food{background:linear-gradient(140deg,#7a2e12,#2a1410 70%)}
.t-spot{background:linear-gradient(140deg,#0f5f63,#0d2228 70%)}
.t-hotel{background:linear-gradient(140deg,#3a3f8f,#141833 70%)}
.t-move{background:linear-gradient(140deg,#3b4658,#151a22 70%)}
.t-show{background:linear-gradient(140deg,#155c9c,#0b1c33 70%)}
.t-game{background:linear-gradient(140deg,#103a8a 0%,#111827 50%,#8a1626 100%)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.time{font-family:var(--num);font-weight:700;font-size:15px;color:#9cc0ff;letter-spacing:.03em}
.card h3{margin:0;font-size:19px;font-weight:900;line-height:1.3;text-wrap:balance}
.loc{display:flex;align-items:center;gap:4px;font-size:12px;color:#cfd6e2}
.desc{margin:0;font-size:13.5px;color:#e6eaf1}
.maplink{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mv{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:rgba(37,99,235,.75);border:1px solid rgba(147,197,253,.3)}
.mv.walk{background:rgba(22,128,72,.8);border-color:rgba(134,239,172,.3)}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12)}
.tag.hot{background:rgba(214,40,58,.9);font-weight:700}
.tag.sug{background:rgba(201,138,18,.92);font-weight:700}
.tag.ok{background:rgba(31,138,85,.92);font-weight:700}
.tips{background:rgba(255,255,255,.09);border-top:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 12px}
.tips b{display:flex;align-items:center;gap:6px;font-size:12px;color:#fde68a;margin-bottom:2px}
.tips p{margin:0;font-size:12.5px;color:#e8ecf2}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:rgba(8,12,20,.72);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opt .p{font-size:11px;color:#93b8ff;margin-right:6px}
.opt .n{font-size:14px;font-weight:700}
.opt .s{font-size:12px;color:#c9d0db;margin-top:2px}
.seatrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:7px 6px;text-align:center}
.seat .l{font-size:10px;color:#c9d0db}
.seat .v{font-family:var(--num);font-size:18px;font-weight:800;line-height:1.1}
.seat.pend{border-style:dashed;border-color:rgba(253,230,138,.6)}
.seat.pend .v{color:#fde68a;font-size:15px}
.taxi{background:var(--taxi);color:#111;border-radius:10px;padding:10px 12px;position:relative}
.taxi .lab{position:absolute;top:0;right:0;background:#111;color:var(--taxi);font-size:10px;font-weight:800;padding:1px 8px;border-bottom-left-radius:8px}
.taxi .zh{font-size:17px;font-weight:900}
.taxi .pt{font-size:12px}

/* generic sections */
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.sec h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h2 svg{flex:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--blue)}
.badge.r{color:var(--red)}
.badge.g{color:var(--gold)}

/* tickets */
.tix{display:flex;flex-direction:column;gap:10px}
.tk{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tk .main{padding:12px 14px;min-width:0}
.tk .stub{border-left:2px dashed var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:92px;background:var(--surface-2)}
.tk .sec-n{font-family:var(--num);font-size:30px;font-weight:800;line-height:1}
.tk .rs{font-family:var(--num);font-size:15px;font-weight:700;color:var(--muted)}
.tk.pend{border-style:dashed}
.tk.pend .sec-n{font-size:20px;color:var(--gold)}
.tk h4{margin:0;font-size:14px}
.seatmap{width:100%;border-radius:12px;border:1px solid var(--line);display:block}

/* address book */
.addr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.addr .info{min-width:0}
.addr .d{font-size:10px;background:var(--surface-2);color:var(--muted);border-radius:4px;padding:0 6px;display:inline-block;margin-bottom:2px}
.addr .zh{font-weight:700}
.addr .pt{font-size:12px;color:var(--muted)}
.iconbtn{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);text-decoration:none}
.iconbtn.done{color:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}

/* calc */
.calc label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.calc input,.calc select{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 0;outline:none}
.calc #amt{font-family:var(--num);font-size:34px;font-weight:800}
.calc .out{font-family:var(--num);font-size:42px;font-weight:800;color:var(--gold);line-height:1.1}
.calc .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rates input{font-family:var(--num);font-size:18px;text-align:center}

/* ledger */
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ledger td.r{text-align:right;font-family:var(--num);font-size:16px;white-space:nowrap;padding-left:10px}
.ledger tr:last-child td{border-bottom:0;font-weight:700}
.cur{font-size:10px;color:var(--muted);font-family:var(--body);margin-left:2px}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.chk .note{display:block;font-size:12px;color:var(--gold);text-decoration:none}
.pack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pack label{font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.pack input{position:absolute;opacity:0;pointer-events:none}
.pack label:has(input:checked){background:var(--surface-2);color:var(--muted);text-decoration:line-through;border-color:transparent}
.pack label:has(input:focus-visible){outline:2px solid var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:6px 14px;border-radius:999px;z-index:60}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.pill{transition:none}}
@media (max-width:380px){.itin{grid-template-columns:50px 1fr;gap:10px}.card h3{font-size:17px}}
</style>
</head>
<body style="margin:0">


<nav class="tabs" aria-label="分頁">
  <div class="in" role="tablist">
    <button role="tab" data-tab="itin" aria-selected="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>行程</button>
    <button role="tab" data-tab="addr" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>地址</button>
    <button role="tab" data-tab="calc" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01M8 10h.01M12 10h.01M16 10h.01"/></svg>換算</button>
    <button role="tab" data-tab="eat" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>吃買</button>
    <button role="tab" data-tab="tools" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>助手</button>
  </div>
</nav>

<main id="app"></main>

<script>
/* ---------- icons ---------- */
var P={
  food:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  spot:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  hotel:'<path d="M2 20V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12"/><path d="M2 14h20"/><path d="M6 14v-3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3M13 14v-3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3"/>',
  move:'<path d="M2 12h5l2 5h7a4 4 0 0 0 0-8h-7l-2 5H2l2-2-2-2Z"/>',
  show:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  game:'<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9c3.9 3.9 3.9 10.3 0 14.2M19.1 4.9c-3.9 3.9-3.9 10.3 0 14.2M2 12h20M12 2v20"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  car:'<path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  walk:'<circle cx="13" cy="4" r="2"/><path d="m9 20 3-6 3 6M6 17l4-10 4 2 3 3"/>',
  bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5A6 6 0 1 0 7.5 11.5c.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
  copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  ticket:'<path d="M2 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  list:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  bag:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>'
};
function ic(n,s,cls){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(cls?' class="'+cls+'"':'')+' aria-hidden="true">'+P[n]+'</svg>';}
function gmap(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- places (for taxi cards + address book) ---------- */
var PL={

/* ---------- renderers ---------- */
function taxiCard(key){var p=PL[key];return '<div class="taxi"><span class="lab">給司機看 TAXI</span><div class="zh">'+esc(p.zh)+'</div><div class="pt">'+esc(p.pt)+'</div></div>';}
function tagHtml(t){var c='';if(/必|重要|預約/.test(t))c='hot';else if(/建議/.test(t))c='sug';else if(/已/.test(t))c='ok';return '<span class="tag '+c+'">#'+esc(t)+'</span>';}
function actHtml(a){
  var p=a.loc?PL[a.loc]:null, map=a.loc?gmap(p.q):null;
  var s='<div class="act"><span class="dot">'+ic(a.type==='game'?'game':a.type,13)+'</span>';
  s+='<article class="card t-'+a.type+(a.img?' has-img':'')+'">';
  if(a.img)s+='<img class="bgimg" src="'+a.img+'" alt="">';else s+='<span class="glyph">'+ic(a.type,120)+'</span>';
  s+='<div class="shade"></div><div class="c">';
  s+='<div class="top"><div><div class="time">'+esc(a.time)+'</div><h3>'+esc(a.title)+'</h3>'+(a.sub?'<div class="loc">'+esc(a.sub)+'</div>':'')+'</div>';
  if(map)s+='<a class="maplink" href="'+map+'" target="_blank" rel="noopener" aria-label="在地圖開啟 '+esc(p.zh)+'">'+ic('nav',15)+'</a>';
  s+='</div>';
  if(p)s+='<div class="loc">'+ic('pin',12)+esc(p.zh)+'</div>';
  if(a.desc)s+='<p class="desc">'+esc(a.desc)+'</p>';
  if(a.seats){s+='<div class="seatrow">'+a.seats.map(function(x,i){return '<div class="seat'+(i===2?' pend':'')+'"><div class="l">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>';}).join('')+'</div>';}
  if(a.move){var w=/步行/.test(a.move)&&!/Taxi/.test(a.move);s+='<div><span class="mv'+(w?' walk':'')+'">'+ic(w?'walk':'car',13)+esc(a.move)+'</span></div>';}
  if(a.taxi)s+=taxiCard(a.taxi);
  if(a.tags)s+='<div class="chips">'+a.tags.map(tagHtml).join('')+'</div>';
  if(a.opts){s+='<div class="opts">'+a.opts.map(function(o,i){return '<div class="opt"><div><div class="n"><span class="p">Plan '+String.fromCharCode(65+i)+'</span>'+esc(o.n)+'</div><div class="s">'+esc(o.s)+'</div></div>'+(o.q?'<a class="maplink" href="'+gmap(o.q)+'" target="_blank" rel="noopener" aria-label="在地圖開啟 '+esc(o.n)+'">'+ic('nav',14)+'</a>':'')+'</div>';}).join('')+'</div>';}
  if(a.tips)s+='<div class="tips"><b>'+ic('bulb',13)+'旅人手札</b><p>'+esc(a.tips)+'</p></div>';
  return s+'</div></article></div>';
}
function countdown(){
  var start=new Date('2026-10-09T19:30:00+08:00'),now=new Date(),diff=start-now;
  if(diff<=0){var end=new Date('2026-10-12T23:59:00+08:00');return now<end?'旅程進行中':'旅程已結束';}
  var d=Math.floor(diff/864e5),hr=Math.floor(diff%864e5/36e5);
  return '距離第一場開打還有 '+(d?d+' 天 ':'')+hr+' 小時';
}

function viewCalc(){
  var r=state.rates, v=parseFloat(state.amt)||0, out=Math.round(v*(parseFloat(r[state.cur])||0));
  return '<section class="sec fade calc"><h2>'+ic('money',18)+'匯率換算</h2><div class="box" style="display:flex;flex-direction:column;gap:16px">'+
   '<div class="two"><div><label for="amt">金額</label><input id="amt" type="number" inputmode="decimal" placeholder="0" value="'+esc(state.amt)+'"></div>'+
   '<div><label for="cur">幣別</label><select id="cur"><option value="MOP"'+(state.cur==='MOP'?' selected':'')+'>澳門幣 MOP</option><option value="HKD"'+(state.cur==='HKD'?' selected':'')+'>港幣 HKD</option><option value="RMB"'+(state.cur==='RMB'?' selected':'')+'>人民幣 RMB</option></select></div></div>'+
   '<div><label>約等於台幣 TWD</label><div class="out" id="out">'+out.toLocaleString()+'</div></div></div>'+
   '<div class="box"><div class="small muted" style="margin-bottom:8px">1 單位 = 幾台幣（預設是概估，出發前照當天匯率改）</div><div class="rates">'+
   ['MOP','HKD','RMB'].map(function(c){return '<div><label for="r'+c+'">'+c+'</label><input id="r'+c+'" data-rate="'+c+'" type="number" step="0.01" value="'+r[c]+'"></div>';}).join('')+
   '</div></div><p class="muted small" style="margin:0">澳門店家大多收港幣，通常 1:1 當澳門幣用，找零會找澳門幣。</p></section>';
}

function itemRow(x,key,label){var c=state.checked;return '<div class="box item"><label class="chk"><input type="checkbox" id="'+key+'" data-k="'+key+'"'+(c[key]?' checked':'')+' aria-label="'+label+' '+esc(x.n)+'"><span></span></label><div class="info"><div class="nm">'+esc(x.n)+(x.d?' <span class="badge">'+x.d+'</span>':'')+(x.ok===false?' <span class="badge r">不能帶回台灣</span>':'')+'</div><div class="wh">'+esc(x.w)+'</div><div class="nt">'+esc(x.t)+'</div></div>'+(x.q?'<a class="iconbtn" href="'+gmap(x.q)+'" target="_blank" rel="noopener" aria-label="地圖">'+ic('nav',16)+'</a>':'')+'</div>';}
function viewEat(){
  var s='<div class="fade"><section class="sec"><h2>'+ic('food',18)+'街邊小吃 必吃清單</h2><p class="muted small" style="margin:0">日期是行程裡經過那一站的日子。吃過就勾。</p><div class="list">';
  SNACKS.forEach(function(x,i){s+=itemRow(x,'snack-'+i,'吃過');});
  s+='</div></section><section class="sec"><h2>'+ic('bag',18)+'伴手禮清單</h2>';
  s+='<div class="box warn"><b>肉乾不能帶回台灣</b><div class="small" style="margin-top:2px">台灣禁止旅客攜帶肉類製品入境，豬肉乾、牛肉乾、肉鬆都算，被查到罰款很重。肉乾在澳門吃掉就好。</div></div><div class="list">';
  GIFTS.forEach(function(x,i){s+=itemRow(x,'gift-'+i,'買了');});
  s+='</div><p class="muted small" style="margin:0">鉅記、咀香園在大三巴街、官也街都有分店。最後一天是早班機，手信要在 10/11 晚上前買齊。</p></section></div>';
  return s;
}

var app=document.getElementById('app');
function render(){
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===state.tab);});
  app.innerHTML=state.tab==='itin'?viewItin():state.tab==='addr'?viewAddr():state.tab==='calc'?viewCalc():state.tab==='eat'?viewEat():viewTools();
}
document.querySelector('nav.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.tab=b.dataset.tab;save('tab',state.tab);render();window.scrollTo(0,0);});
app.addEventListener('click',function(e){
  var p=e.target.closest('.pill');
  if(p){state.day=+p.dataset.day;save('day',state.day);render();var top=document.querySelector('.itin').getBoundingClientRect().top+window.scrollY-80;if(window.scrollY>top)window.scrollTo(0,top);return;}
  var cp=e.target.closest('[data-copy]');
  if(cp){var txt=cp.dataset.copy;var ok=function(){cp.classList.add('done');cp.innerHTML=ic('check',16);toast('已複製');setTimeout(function(){cp.classList.remove('done');cp.innerHTML=ic('copy',16);},1600);};
    try{navigator.clipboard.writeText(txt).then(ok,function(){toast(txt);});}catch(err){toast(txt);}}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.k){state.checked[t.dataset.k]=t.checked;save('checked',state.checked);}
  if(t.id==='cur'){state.cur=t.value;updCalc();}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='amt'){state.amt=t.value;updCalc();}
  if(t.dataset.rate){state.rates[t.dataset.rate]=t.value;save('rates',state.rates);updCalc();}
});
function updCalc(){var o=document.getElementById('out');if(!o)return;var v=parseFloat(state.amt)||0;o.textContent=Math.round(v*(parseFloat(state.rates[state.cur])||0)).toLocaleString();}
var tt;function toast(m){var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},1800);}
render();
</script>
